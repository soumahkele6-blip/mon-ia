<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon IA</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 15px; }
    .chat-box { height: 50vh; overflow-y: auto; border: 1px solid #333; padding: 10px; margin-bottom: 10px; border-radius: 8px; display: flex; flex-direction: column; }
    .msg { margin: 6px 0; padding: 8px 12px; border-radius: 6px; max-width: 85%; word-wrap: break-word; }
    .user { background: #007bff; align-self: flex-end; }
    .bot { background: #222; border: 1px solid #444; align-self: flex-start; }
    input, textarea, button { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border-radius: 6px; border: 1px solid #444; background: #1a1a1a; color: #fff; font-size: 14px; }
    textarea { height: 60px; resize: none; }
    button { background: #28a745; color: white; font-weight: bold; margin-top: 8px; cursor: pointer; border: none; }
    label { font-size: 12px; color: #aaa; margin-top: 5px; display: block; }
  </style>
</head>
<body>

  <h3>Mon IA (Gemini 1.5 Flash)</h3>
  
  <input type="password" id="apiKey" placeholder="Collez votre clé API Gemini ici">
  
  <label for="systemInstruction">Personnalité / Instructions de l'IA :</label>
  <textarea id="systemInstruction" placeholder="Ex: Tu es Kele, un assistant expert en informatique, très concis et poli."></textarea>
  
  <div class="chat-box" id="chat"></div>

  <input type="text" id="userInput" placeholder="Posez une question...">
  <button onclick="processRequest()">Envoyer</button>

  <script>
    async function processRequest() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const input = document.getElementById('userInput').value.trim();
      const systemInstruction = document.getElementById('systemInstruction').value.trim();

      if (!apiKey || !input) {
        alert("Veuillez entrer votre clé API et un message.");
        return;
      }

      appendMessage(input, 'user');
      document.getElementById('userInput').value = '';

      const loadingMsg = appendMessage("[Réflexion en cours...]", 'bot');

      // Modèle de votre liste supporté en HTTP standard
      const model = 'gemini-1.5-flash';

      const payload = {
        contents: [{ parts: [{ text: input }] }]
      };

      if (systemInstruction !== "") {
        payload.systemInstruction = {
          parts: [{ text: systemInstruction }]
        };
      }

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        loadingMsg.remove();

        if (data.error) {
          appendMessage("Erreur API : " + data.error.message, 'bot');
          return;
        }

        if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
          const textResponse = data.candidates[0].content.parts[0].text;
          appendMessage(textResponse, 'bot');
        } else {
          appendMessage("Aucune réponse textuelle retournée par le modèle.", 'bot');
        }
      } catch (error) {
        loadingMsg.remove();
        appendMessage("Erreur réseau : " + error.message, 'bot');
      }
    }

    function appendMessage(text, sender) {
      const chat = document.getElementById('chat');
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${sender}`;
      msgDiv.innerText = text;
      chat.appendChild(msgDiv);
      chat.scrollTop = chat.scrollHeight;
      return msgDiv;
    }
  </script>
</body>
</html>
