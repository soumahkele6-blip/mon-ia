<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assistant Groq - GPT OSS 120B</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #131b2e;
      --border: #23304b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #f97316; /* Couleur Groq / Orange vif */
      --accent-hover: #ea580c;
      --success: #22c55e;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 850px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .header {
      text-align: center;
      margin-bottom: 0.5rem;
    }

    .header h1 {
      font-size: 2rem;
      color: #fff;
      margin-bottom: 0.25rem;
    }

    .badge-model {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.3rem 0.8rem;
      background: rgba(249, 115, 22, 0.15);
      border: 1px solid var(--accent);
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
      font-family: monospace;
    }

    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: #cbd5e1;
    }

    input, textarea {
      width: 100%;
      padding: 0.8rem 1rem;
      background: #090e18;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 1rem;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    button {
      width: 100%;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      border: none;
      padding: 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s, opacity 0.2s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .status {
      font-size: 0.85rem;
      font-weight: 600;
    }

    .output-box {
      background: #090e18;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      font-size: 0.95rem;
      line-height: 1.6;
      white-space: pre-wrap;
      max-height: 550px;
      overflow-y: auto;
      color: #e2e8f0;
    }

    .copy-btn {
      width: auto;
      background: #1e293b;
      color: var(--text);
      font-size: 0.8rem;
      padding: 0.3rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
    }

    .copy-btn:hover {
      background: #334155;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Console IA Groq</h1>
      <span class="badge-model">openai/gpt-oss-120b</span>
    </div>

    <!-- Formulaire d'envoi -->
    <div class="card">
      <label for="apiKey">Clé API Groq (gsk_...)</label>
      <input type="password" id="apiKey" placeholder="gsk_..." />

      <label for="prompt">Votre requête ou question</label>
      <textarea id="prompt" placeholder="Posez une question complexe, demandez du code ou une analyse stratégique..."></textarea>

      <button id="sendBtn" onclick="genererReponse()">Exécuter avec GPT-OSS 120B ⚡</button>
    </div>

    <!-- Affichage du résultat -->
    <div class="card" id="outputCard" style="display: none;">
      <div class="result-header">
        <label style="margin: 0;">Réponse générée :</label>
        <div style="display: flex; align-items: center; gap: 0.75rem;">
          <span class="status" id="status">En cours...</span>
          <button class="copy-btn" onclick="copierTexte()">Copier</button>
        </div>
      </div>
      <div class="output-box" id="output"></div>
    </div>
  </div>

  <script>
    const MODEL_ID = "openai/gpt-oss-120b";

    // Mémorise la clé API localement pour éviter de la ressaisir à chaque fois
    window.addEventListener("DOMContentLoaded", () => {
      const savedKey = localStorage.getItem("groq_api_key");
      if (savedKey) {
        document.getElementById("apiKey").value = savedKey;
      }
    });

    async function genererReponse() {
      const apiKeyInput = document.getElementById("apiKey");
      const promptInput = document.getElementById("prompt");
      const sendBtn = document.getElementById("sendBtn");
      const outputCard = document.getElementById("outputCard");
      const statusText = document.getElementById("status");
      const outputBox = document.getElementById("output");

      const apiKey = apiKeyInput.value.trim();
      const prompt = promptInput.value.trim();

      if (!apiKey) {
        alert("Veuillez saisir votre clé API Groq (gsk_...).");
        return;
      }
      if (!prompt) {
        alert("Veuillez entrer une requête.");
        return;
      }

      // Sauvegarde dans le stockage local du navigateur
      localStorage.setItem("groq_api_key", apiKey);

      outputCard.style.display = "block";
      statusText.innerText = "Inférence en cours...";
      statusText.style.color = "var(--accent)";
      outputBox.innerText = "Traitement ultra-rapide sur les puces LPU de Groq...";
      sendBtn.disabled = true;

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${apiKey}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: MODEL_ID,
            messages: [
              {
                role: "system",
                content: "Tu es un assistant IA de pointe, précis, direct et exhaustif."
              },
              {
                role: "user",
                content: prompt
              }
            ],
            temperature: 0.6
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || `Erreur serveur HTTP ${response.status}`);
        }

        const reponseTexte = data.choices?.[0]?.message?.content;
        outputBox.innerText = reponseTexte || "Aucune réponse renvoyée.";
        statusText.innerText = "Succès ✓";
        statusText.style.color = "var(--success)";

      } catch (err) {
        outputBox.innerText = "Erreur : " + err.message;
        statusText.innerText = "Échec";
        statusText.style.color = "var(--error)";
      } finally {
        sendBtn.disabled = false;
      }
    }

    function copierTexte() {
      const texte = document.getElementById("output").innerText;
      if (texte) {
        navigator.clipboard.writeText(texte);
        alert("Réponse copiée dans le presse-papiers !");
      }
    }
  </script>
</body>
</html>
