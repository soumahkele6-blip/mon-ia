<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini Free Tier Orchestrator</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --accent: #818cf8;
      --success: #34d399;
      --warning: #fbbf24;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 2rem 1rem; min-height: 100vh; }
    .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 1.5rem; }
    header { text-align: center; margin-bottom: 1rem; }
    header h1 { font-size: 2rem; background: linear-gradient(90deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.5rem; }
    header p { color: var(--muted); font-size: 0.95rem; }
    .card { background-color: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25); }
    label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
    input, textarea, select { width: 100%; padding: 0.75rem 1rem; background: #0b1120; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.95rem; outline: none; margin-bottom: 1rem; }
    input:focus, textarea:focus, select:focus { border-color: var(--primary); }
    textarea { resize: vertical; min-height: 100px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }
    button { background: linear-gradient(90deg, var(--primary), var(--accent)); color: #000; font-weight: 700; border: none; padding: 0.85rem 1.5rem; border-radius: 8px; cursor: pointer; font-size: 1rem; width: 100%; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .pipeline-step { margin-top: 1.5rem; border-left: 3px solid var(--border); padding-left: 1.25rem; }
    .step-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.5rem; }
    .badge { font-size: 0.75rem; font-weight: 700; padding: 0.25rem 0.6rem; border-radius: 999px; background: #334155; color: var(--text); }
    .badge.running { background: var(--warning); color: #000; }
    .badge.done { background: var(--success); color: #000; }
    .step-output { background: #0b1120; border: 1px solid var(--border); border-radius: 8px; padding: 1rem; font-size: 0.9rem; line-height: 1.6; white-space: pre-wrap; max-height: 300px; overflow-y: auto; color: #cbd5e1; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Pipeline Gemini (Compte Gratuit)</h1>
      <p>Modèle Puissant (gemini-2.5-flash) ➔ Synthèse Rapide (gemini-2.5-flash-lite)</p>
    </header>

    <div class="card">
      <label for="apiKey">Clé API Google AI Studio</label>
      <input type="password" id="apiKey" placeholder="AIzaSy..." />

      <div class="grid-2">
        <div>
          <label for="model1">1er Modèle (Le plus puissant gratuit)</label>
          <select id="model1">
            <option value="gemini-2.5-flash" selected>gemini-2.5-flash (Recommandé)</option>
            <option value="gemini-flash-latest">gemini-flash-latest</option>
            <option value="gemini-2.5-pro">gemini-2.5-pro (Si quota dispo)</option>
          </select>
        </div>
        <div>
          <label for="model2">2e Modèle (Synthèse rapide)</label>
          <select id="model2">
            <option value="gemini-2.5-flash-lite" selected>gemini-2.5-flash-lite (Rapide)</option>
            <option value="gemini-2.5-flash">gemini-2.5-flash</option>
          </select>
        </div>
      </div>

      <label for="promptInput">Votre question ou sujet</label>
      <textarea id="promptInput" placeholder="Ex: Propose une stratégie détaillée pour un nouveau projet..."></textarea>

      <button id="runBtn" onclick="runPipeline()">Lancer le pipeline ⚡</button>
    </div>

    <div class="card" id="resultsSection" style="display: none;">
      <h2 style="font-size: 1.2rem; margin-bottom: 1rem;">Résultats</h2>

      <!-- Étape 1 -->
      <div class="pipeline-step">
        <div class="step-header">
          <div><strong id="labelModel1">Étape 1 : Analyse</strong></div>
          <span class="badge" id="status1">En attente</span>
        </div>
        <div class="step-output" id="out1">...</div>
      </div>

      <!-- Étape 2 -->
      <div class="pipeline-step" style="margin-top: 2rem;">
        <div class="step-header">
          <div><strong id="labelModel2">Étape 2 : Plan d'action</strong></div>
          <span class="badge" id="status2">En attente</span>
        </div>
        <div class="step-output" id="out2">...</div>
      </div>
    </div>
  </div>

  <script>
    async function callGemini(modelName, prompt, apiKey) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
      });

      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.error?.message || `Erreur HTTP ${response.status}`);
      }
      return data.candidates?.[0]?.content?.parts?.[0]?.text || "Aucune réponse.";
    }

    async function runPipeline() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const prompt = document.getElementById('promptInput').value.trim();
      const model1 = document.getElementById('model1').value;
      const model2 = document.getElementById('model2').value;
      const runBtn = document.getElementById('runBtn');

      if (!apiKey || !prompt) {
        alert("Veuillez saisir votre clé API et votre texte.");
        return;
      }

      document.getElementById('resultsSection').style.display = 'block';
      const status1 = document.getElementById('status1');
      const status2 = document.getElementById('status2');
      const out1 = document.getElementById('out1');
      const out2 = document.getElementById('out2');

      status1.className = 'badge running';
      status1.innerText = 'Génération...';
      out1.innerText = `Appel à ${model1}...`;
      status2.className = 'badge';
      status2.innerText = 'En attente';
      out2.innerText = 'En attente...';
      runBtn.disabled = true;

      try {
        // Étape 1 avec le modèle puissant
        const prompt1 = `Tu es un expert d'élite. Analyse en détail le sujet suivant :\n\n${prompt}`;
        const rep1 = await callGemini(model1, prompt1, apiKey);
        out1.innerText = rep1;
        status1.className = 'badge done';
        status1.innerText = 'Terminé ✓';

        // Étape 2 avec le modèle flash
        status2.className = 'badge running';
        status2.innerText = 'Synthèse...';
        out2.innerText = `Appel à ${model2}...`;

        const prompt2 = `Voici une analyse détaillée :\n"""\n${rep1}\n"""\n\nSynthétise cette analyse en :
1. Les 3 points clés à retenir.
2. Un plan d'action immédiat en 4 étapes claires.`;

        const rep2 = await callGemini(model2, prompt2, apiKey);
        out2.innerText = rep2;
        status2.className = 'badge done';
        status2.innerText = 'Terminé ✓';
      } catch (err) {
        alert("Erreur : " + err.message);
      } finally {
        runBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
