<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chat IA Groq + Recherche Vercel</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #131b2e;
      --sidebar: #0b1120;
      --border: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #f97316;
      --web: #38bdf8;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); height: 100dvh; display: flex; overflow: hidden; position: relative; }

    #sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; width: 280px;
      background: var(--sidebar); border-right: 1px solid var(--border);
      z-index: 100; transform: translateX(-100%); transition: transform 0.25s ease;
      display: flex; flex-direction: column; padding: 1rem;
    }
    #sidebar.open { transform: translateX(0); }
    #sidebar-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); z-index: 90; display: none; }
    .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border); }
    .new-chat-btn { width: 100%; background: var(--accent); color: #fff; border: none; padding: 0.7rem; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 1rem; }
    .chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.4rem; }
    .chat-item { display: flex; align-items: center; justify-content: space-between; padding: 0.65rem 0.8rem; background: #111827; border: 1px solid transparent; border-radius: 8px; cursor: pointer; font-size: 0.85rem; color: var(--text); }
    .chat-item.active { border-color: var(--accent); background: #1e293b; }
    .chat-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .chat-delete { color: var(--muted); margin-left: 0.5rem; cursor: pointer; padding: 0.2rem; }
    .chat-delete:hover { color: var(--danger); }

    .main-wrapper { flex: 1; display: flex; flex-direction: column; height: 100%; width: 100%; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 0.65rem 0.8rem; background: #0f172a; border-bottom: 1px solid var(--border); z-index: 10; gap: 0.4rem; }
    .header-btn { background: transparent; border: 1px solid var(--border); color: var(--text); width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem; flex-shrink: 0; }
    .header-title { font-size: 0.85rem; font-weight: 600; color: var(--accent); background: rgba(249, 115, 22, 0.1); padding: 0.35rem 0.8rem; border-radius: 20px; border: 1px solid rgba(249, 115, 22, 0.2); }

    #chat-container { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; scroll-behavior: smooth; }
    .welcome-screen { margin: auto; text-align: center; color: var(--muted); max-width: 330px; }
    .welcome-screen h2 { color: var(--text); margin-bottom: 0.5rem; font-size: 1.3rem; }

    .message { max-width: 88%; padding: 0.85rem 1.1rem; border-radius: 14px; line-height: 1.6; font-size: 0.95rem; word-break: break-word; white-space: pre-wrap; }
    .message.user { align-self: flex-end; background-color: var(--accent); color: #fff; border-bottom-right-radius: 2px; }
    .message.assistant { align-self: flex-start; background-color: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 2px; color: #e2e8f0; }
    .message.loading { color: var(--muted); font-style: italic; }

    footer { padding: 0.75rem 1rem; background: #090d16; border-top: 1px solid var(--border); }
    .input-wrapper { max-width: 800px; margin: 0 auto; display: flex; align-items: flex-end; gap: 0.5rem; background: #0f172a; border: 1px solid var(--border); border-radius: 24px; padding: 0.4rem 0.6rem 0.4rem 1rem; }
    .input-wrapper:focus-within { border-color: var(--accent); }

    textarea { flex: 1; background: transparent; border: none; color: var(--text); font-size: 1rem; outline: none; resize: none; max-height: 140px; min-height: 24px; line-height: 1.4; padding: 0.3rem 0; }
    #sendBtn { background: var(--accent); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 1rem; z-index: 200; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.5rem; max-width: 400px; width: 100%; }
    .modal input { width: 100%; padding: 0.75rem 1rem; background: #090e18; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 1rem; margin: 1rem 0; outline: none; }
    .modal-btn { width: 100%; background: var(--accent); color: #fff; border: none; padding: 0.75rem; border-radius: 8px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

  <aside id="sidebar">
    <div class="sidebar-header">
      <h3 style="font-size: 1.1rem;">Historique</h3>
      <button class="header-btn" style="border:none;" onclick="toggleSidebar()">✕</button>
    </div>
    <button class="new-chat-btn" onclick="startNewChat(true)">+ Nouvelle discussion</button>
    <div class="chat-list" id="chatList"></div>
  </aside>

  <div class="main-wrapper">
    <header>
      <div style="display: flex; align-items: center; gap: 0.4rem;">
        <button class="header-btn" title="Historique" onclick="toggleSidebar()">☰</button>
        <button class="header-btn" title="Nouveau" onclick="startNewChat(false)">+</button>
      </div>

      <div class="header-title">Vercel Web + GPT-120B</div>
      <button class="header-btn" title="Clé API" onclick="openKeyModal()">⚙️</button>
    </header>

    <main id="chat-container">
      <div class="welcome-screen" id="welcome">
        <h2>Système Vercel Connecté 🌐</h2>
        <p>Le serveur Python Vercel effectue les recherches web en direct et GPT-120B formule la réponse instantanément.</p>
      </div>
    </main>

    <footer>
      <div class="input-wrapper">
        <textarea id="promptInput" rows="1" placeholder="Posez une question, demandez du code ou un match..." oninput="autoResize(this)" onkeydown="handleKeyDown(event)"></textarea>
        <button id="sendBtn" onclick="sendMessage()">➤</button>
      </div>
    </footer>
  </div>

  <div class="modal-overlay" id="keyModal">
    <div class="modal">
      <h3>Clé API Groq</h3>
      <p style="color: var(--muted); font-size: 0.85rem; margin-top: 0.25rem;">Collez votre clé <code>gsk_...</code></p>
      <input type="password" id="modalKeyInput" placeholder="gsk_..." />
      <button class="modal-btn" onclick="saveApiKey()">Enregistrer</button>
    </div>
  </div>

  <script>
    const MODEL_ID = "openai/gpt-oss-120b";
    let chats = JSON.parse(localStorage.getItem("groq_saved_chats") || "[]");
    let currentChatId = null;

    window.addEventListener("DOMContentLoaded", () => {
      const savedKey = localStorage.getItem("groq_api_key");
      if (!savedKey) openKeyModal();

      renderChatList();
      if (chats.length > 0) loadChat(chats[0].id);
      else startNewChat(false);
    });

    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("sidebar-overlay");
      const isOpen = sidebar.classList.contains("open");
      sidebar.classList.toggle("open", !isOpen);
      overlay.style.display = !isOpen ? "block" : "none";
    }

    function openKeyModal() {
      document.getElementById("modalKeyInput").value = localStorage.getItem("groq_api_key") || "";
      document.getElementById("keyModal").style.display = "flex";
    }

    function saveApiKey() {
      const key = document.getElementById("modalKeyInput").value.trim();
      if (!key) return alert("Veuillez saisir votre clé API Groq.");
      localStorage.setItem("groq_api_key", key);
      document.getElementById("keyModal").style.display = "none";
    }

    function startNewChat(closeSidebarAfter = false) {
      currentChatId = Date.now().toString();
      chats.unshift({ id: currentChatId, title: "Nouvelle discussion", messages: [] });
      saveChats();
      renderChatList();
      renderCurrentMessages([]);
      if (closeSidebarAfter) toggleSidebar();
    }

    function loadChat(chatId) {
      currentChatId = chatId;
      const chat = chats.find(c => c.id === chatId);
      if (chat) renderCurrentMessages(chat.messages);
      renderChatList();
      if (document.getElementById("sidebar").classList.contains("open")) toggleSidebar();
    }

    function deleteChat(e, chatId) {
      e.stopPropagation();
      chats = chats.filter(c => c.id !== chatId);
      saveChats();
      if (currentChatId === chatId) {
        if (chats.length > 0) loadChat(chats[0].id);
        else startNewChat(false);
      } else renderChatList();
    }

    function saveChats() {
      localStorage.setItem("groq_saved_chats", JSON.stringify(chats));
    }

    function renderChatList() {
      const list = document.getElementById("chatList");
      list.innerHTML = "";
      chats.forEach(chat => {
        const item = document.createElement("div");
        item.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
        item.onclick = () => loadChat(chat.id);
        item.innerHTML = `
          <span class="chat-title">${chat.title}</span>
          <span class="chat-delete" onclick="deleteChat(event, '${chat.id}')">🗑️</span>
        `;
        list.appendChild(item);
      });
    }

    function renderCurrentMessages(messages) {
      const container = document.getElementById("chat-container");
      container.innerHTML = "";
      if (messages.length === 0) {
        container.innerHTML = `
          <div class="welcome-screen" id="welcome">
            <h2>Système Vercel Connecté 🌐</h2>
            <p>Posez votre question. L'API Python Vercel s'occupe de la recherche web en direct.</p>
          </div>
        `;
        return;
      }
      messages.forEach(m => appendMessage(m.role, m.content));
    }

    function autoResize(el) {
      el.style.height = "auto";
      el.style.height = Math.min(el.scrollHeight, 140) + "px";
    }

    function handleKeyDown(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function isTemporalQuery(text) {
      const keywords = ["hier", "aujourd'hui", "ce soir", "demain", "semaine", "score", "match", "résultat", "classement", "gagné", "actu", "actualité", "direct", "météo", "prix", "dernière", "dernier", "championnat"];
      const lower = text.toLowerCase();
      return keywords.some(k => lower.includes(k));
    }

    // Appel à votre propre API Python sur Vercel
    async function searchViaVercelPython(query) {
      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        if (!res.ok) return "";
        const data = await res.json();
        return data.results || "";
      } catch (e) {
        return "";
      }
    }

    async function sendMessage() {
      const apiKey = localStorage.getItem("groq_api_key");
      if (!apiKey) return openKeyModal();

      const input = document.getElementById("promptInput");
      const userText = input.value.trim();
      if (!userText) return;

      const welcome = document.getElementById("welcome");
      if (welcome) welcome.remove();

      let currentChat = chats.find(c => c.id === currentChatId);
      if (!currentChat) {
        startNewChat();
        currentChat = chats.find(c => c.id === currentChatId);
      }

      if (currentChat.messages.length === 0) {
        currentChat.title = userText.slice(0, 26) + (userText.length > 26 ? "..." : "");
      }

      appendMessage("user", userText);
      currentChat.messages.push({ role: "user", content: userText });
      saveChats();
      renderChatList();

      input.value = "";
      autoResize(input);

      const assistantBubble = appendMessage("assistant loading", "Traitement...");
      document.getElementById("sendBtn").disabled = true;

      try {
        const today = new Date().toLocaleDateString('fr-FR', {
          weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
        });

        let searchFacts = "";

        if (isTemporalQuery(userText)) {
          assistantBubble.innerText = "🌐 Recherche web via le serveur Python Vercel...";
          searchFacts = await searchViaVercelPython(userText);
        }

        assistantBubble.innerText = "";
        assistantBubble.classList.remove("loading");

        const systemPrompt = `Tu es un assistant direct, clair, fluide et concis.
DATE DU JOUR : ${today}.
RÈGLES :
1. Aucun tableau avec des barres '|'. Rédige de façon humaine et aérée.
2. Si des informations du web sont fournies ci-dessous, donne les résultats récents et scores précis dès la première phrase.
${searchFacts ? `\nDONNÉES DU WEB EN TEMPS RÉEL :\n"""\n${searchFacts}\n"""` : ""}`;

        const apiMessages = [
          { role: "system", content: systemPrompt },
          ...currentChat.messages
        ];

        // Streaming Groq LPU
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${apiKey}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: MODEL_ID,
            messages: apiMessages,
            temperature: 0.5,
            stream: true
          })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error?.message || `Erreur HTTP ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let fullReply = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split("\n");

          for (const line of lines) {
            if (line.startsWith("data: ") && line.trim() !== "data: [DONE]") {
              try {
                const parsed = JSON.parse(line.slice(6));
                const content = parsed.choices[0]?.delta?.content || "";
                fullReply += content;
                assistantBubble.innerText = fullReply;
                document.getElementById("chat-container").scrollTop = document.getElementById("chat-container").scrollHeight;
              } catch (e) {}
            }
          }
        }

        currentChat.messages.push({ role: "assistant", content: fullReply });
        saveChats();

      } catch (err) {
        assistantBubble.innerText = "Erreur : " + err.message;
        assistantBubble.style.color = "var(--danger)";
      } finally {
        document.getElementById("sendBtn").disabled = false;
      }
    }

    function appendMessage(role, text) {
      const container = document.getElementById("chat-container");
      const div = document.createElement("div");
      div.className = `message ${role}`;
      div.innerText = text;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
      return div;
    }
  </script>
</body>
</html>
