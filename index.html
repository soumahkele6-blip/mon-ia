<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assistant Gemini 2.5 Flash</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151d2e;
      --border: #243049;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .header {
      text-align: center;
      margin-bottom: 0.5rem;
    }

    .header h1 {
      font-size: 1.8rem;
      color: var(--accent);
      margin-bottom: 0.25rem;
    }

    .header p {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .badge-model {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.2rem 0.6rem;
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 0.8rem;
      color: #38bdf8;
      font-family: monospace;
    }

    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }

    input, textarea {
      width: 100%;
      padding: 0.75rem;
      background: #070b14;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 1rem;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    button {
      width: 100%;
      background: var(--accent);
      color: #04101e;
      font-weight: 700;
      border: none;
      padding: 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }

    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .status {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .output-box {
      background: #070b14;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      font-size: 0.95rem;
      line-height: 1.6;
      white-space: pre-wrap;
      max-height: 500px;
      overflow-y: auto;
      color: #e2e8f0;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Gemini Console</h1>
      <p>Modèle sélectionné :</p>
      <span class="badge-model">gemini-2.5-flash</span>
    </div>

    <!-- Entrées -->
    <div class="card">
      <label for="apiKey">Clé API</label>
      <input type="password" id="apiKey" placeholder="AIzaSy..." />

      <label for="prompt">Votre prompt / question</label>
      <textarea id="prompt" placeholder="Posez votre question ou détaillez votre tâche..."></textarea>

      <button id="sendBtn" onclick="generate()">Générer la réponse</button>
    </div>

    <!-- Sortie -->
    <div class="card" id="outputCard" style="display: none;">
      <div class="result-header">
        <label style="margin: 0;">Réponse :</label>
        <span class="status" id="status">En cours...</span>
      </div>
      <div class="output-box" id="output"></div>
    </div>
  </div>

  <script>
    const MODEL_NAME = "gemini-2.5-flash";

    async function generate() {
      const apiKey = document.getElementById("apiKey").value.trim();
      const prompt = document.getElementById("prompt").value.trim();
      const sendBtn = document.getElementById("sendBtn");
      const outputCard = document.getElementById("outputCard");
      const statusText = document.getElementById("status");
      const outputBox = document.getElementById("output");

      if (!apiKey) {
        alert("Veuillez saisir votre clé API Google AI.");
        return;
      }
      if (!prompt) {
        alert("Veuillez saisir une requête.");
        return;
      }

      outputCard.style.display = "block";
      statusText.innerText = "Génération en cours...";
      statusText.style.color = "#38bdf8";
      outputBox.innerText = "Connexion à Gemini...";
      sendBtn.disabled = true;

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`;
        
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || `Erreur HTTP ${response.status}`);
        }

        const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
        outputBox.innerText = text || "Aucune réponse reçue.";
        statusText.innerText = "Terminé ✓";
        statusText.style.color = "#34d399";

      } catch (err) {
        outputBox.innerText = "Erreur : " + err.message;
        statusText.innerText = "Échec";
        statusText.style.color = "#f87171";
      } finally {
        sendBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
