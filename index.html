<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IA Multi-Modèles</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 15px; }
    .chat-box { height: 60vh; overflow-y: auto; border: 1px solid #333; padding: 10px; margin-bottom: 10px; border-radius: 8px; display: flex; flex-direction: column; }
    .msg { margin: 8px 0; padding: 8px 12px; border-radius: 6px; max-width: 85%; word-wrap: break-word; }
    .user { background: #007bff; align-self: flex-end; }
    .bot { background: #222; border: 1px solid #444; align-self: flex-start; }
    input, select, button { width: 100%; padding: 12px; margin-top: 5px; box-sizing: border-box; border-radius: 6px; border: 1px solid #444; background: #1a1a1a; color: #fff; }
    button { background: #28a745; color: white; font-weight: bold; margin-top: 10px; cursor: pointer; border: none; }
  </style>
</head>
<body>

  <h2>Mon IA Multi-Modèles</h2>
  
  <input type="password" id="apiKey" placeholder="Collez votre clé API Gemini ici">
  
  <div class="chat-box" id="chat"></div>

  <select id="taskType">
    <option value="auto">Auto-Détection (Orchestrateur)</option>
    <option value="chat">Discussion Rapide (Gemini 2.5 Flash)</option>
    <option value="pro">Raisonnement Avancé (Gemini 2.5 Pro)</option>
    <option value="research">Recherche Approfondie (Deep Research)</option>
  </select>

  <input type="text" id="userInput" placeholder="Posez une question...">
  <button onclick="processRequest()">Envoyer</button>

  <script>
    async function processRequest() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const input = document.getElementById('userInput').value.trim();
      const taskType = document.getElementById('taskType').value;

      if (!apiKey || !input) {
        alert("Veuillez entrer une clé API et un message.");
        return;
      }

      appendMessage(input, 'user');
      document.getElementById('userInput').value = '';

      // Sélection d'un modèle officiel valide dans l'API Gemini
      let selectedModel = 'gemini-2.5-flash';
      
      if (taskType === 'pro') {
        selectedModel = 'gemini-2.5-pro';
      } else if (taskType === 'research' || (taskType === 'auto' && input.toLowerCase().includes('recherche'))) {
        selectedModel = 'deep-research-preview-04-2026';
      }

      const loadingMsg = appendMessage(`[Utilisation du modèle : ${selectedModel}]...`, 'bot');

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: input }] }]
          })
        });

        const data = await response.json();
        
        // Suppression du message de chargement
        loadingMsg.remove();

        if (data.error) {
          appendMessage("Erreur API : " + data.error.message, 'bot');
          return;
        }

        if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
          const textResponse = data.candidates[0].content.parts[0].text;
          appendMessage(textResponse, 'bot');
        } else {
          appendMessage("Aucun texte renvoyé par l'API.", 'bot');
        }
      } catch (error) {
        loadingMsg.remove();
        appendMessage("Erreur réseau : " + error.message, 'bot');
      }
    }

    function appendMessage(text, sender) {
      const chat = document.getElementById('chat');
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${sender}`;
      msgDiv.innerText = text;
      chat.appendChild(msgDiv);
      chat.scrollTop = chat.scrollHeight;
      return msgDiv;
    }
  </script>
</body>
</html>
