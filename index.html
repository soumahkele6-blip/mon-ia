<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IA Multi-Modèles</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 15px; }
    .chat-box { height: 60vh; overflow-y: auto; border: 1px solid #333; padding: 10px; margin-bottom: 10px; border-radius: 8px; }
    .msg { margin: 8px 0; padding: 8px 12px; border-radius: 6px; max-width: 85%; }
    .user { background: #007bff; align-self: flex-end; margin-left: auto; }
    .bot { background: #222; border: 1px solid #444; }
    input, select, button { width: 100%; padding: 12px; margin-top: 5px; box-sizing: border-box; border-radius: 6px; border: none; }
    button { background: #28a745; color: white; font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>

  <h2>Mon IA Multi-Modèles</h2>
  
  <input type="password" id="apiKey" placeholder="Collez votre clé API Gemini ici">
  
  <div class="chat-box" id="chat"></div>

  <select id="taskType">
    <option value="auto">Auto-Détection (Orchestrateur)</option>
    <option value="chat">Discussion / Raisonnement (Gemini 3.8 Flash)</option>
    <option value="research">Recherche Approfondie (Deep Research)</option>
    <option value="image">Génération d'image (Gemini 3.1 Flash Image)</option>
  </select>

  <input type="text" id="userInput" placeholder="Posez une question ou demandez une image...">
  <button onclick="processRequest()">Envoyer</button>

  <script>
    async function processRequest() {
      const apiKey = document.getElementById('apiKey').value;
      const input = document.getElementById('userInput').value;
      const taskType = document.getElementById('taskType').value;
      const chat = document.getElementById('chat');

      if (!apiKey || !input) {
        alert("Veuillez entrer une clé API et un message.");
        return;
      }

      appendMessage(input, 'user');
      document.getElementById('userInput').value = '';

      // Sélection dynamique du modèle
      let selectedModel = 'gemini-3.8-flash';
      
      if (taskType === 'research' || (taskType === 'auto' && input.toLowerCase().includes('recherche'))) {
        selectedModel = 'deep-research-max-preview-04-2026';
      } else if (taskType === 'image' || (taskType === 'auto' && (input.toLowerCase().includes('dessine') || input.toLowerCase().includes('image')))) {
        selectedModel = 'gemini-3.1-flash-image';
      }

      appendMessage(`[Utilisation du modèle : ${selectedModel}]...`, 'bot');

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: input }] }]
          })
        });

        const data = await response.json();
        
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          const textResponse = data.candidates[0].content.parts[0].text;
          appendMessage(textResponse, 'bot');
        } else {
          appendMessage("Réponse reçue ou format spécifique au modèle non textuel.", 'bot');
        }
      } catch (error) {
        appendMessage("Erreur lors de la requête : " + error.message, 'bot');
      }
    }

    function appendMessage(text, sender) {
      const chat = document.getElementById('chat');
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${sender}`;
      msgDiv.innerText = text;
      chat.appendChild(msgDiv);
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
